<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <base href="./">
    <script>
      // Set the theme class before first paint so a dark-preferring user
      // never sees a light flash on hard load/reload - useTheme.tsx's
      // useEffect only runs after paint, which is too late to prevent FOUC.
      // Mirrors useTheme.tsx's own persisted-theme-then-media-query logic.
      (function () {
        try {
          var t = localStorage.getItem('marbor-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(t);
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marbor | Admin Dashboard</title>
    <meta name="description" content="The Marbor dashboard - warm-state GPU routing, multi-runtime cluster telemetry, per-key cost tracking, and cloud-overflow savings for self-hosted LLM inference across Ollama, vLLM, TGI, llama.cpp, and MLX." />
    <!-- App/admin UI, not a search landing page: keep crawlers on the marketing site + docs, and never index an admin dashboard. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
