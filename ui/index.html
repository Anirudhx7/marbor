<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <base href="./">
    <!-- Absolute path on purpose: Vite prefixes it with the build base (/ here, ./ in the static demo). Keep it a plain blocking script so the theme class lands before first paint. -->
    <script src="/assets/theme-init.js"></script>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marbor | Admin Dashboard</title>
    <meta name="description" content="The Marbor dashboard: warm-state GPU routing, multi-runtime telemetry, per-key cost tracking, and cloud-overflow savings for self-hosted LLM inference." />
    <!-- App/admin UI, not a search landing page: keep crawlers on the marketing site + docs, and never index an admin dashboard. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
