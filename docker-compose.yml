version: "3.8"

services:
  ollama-mesh:
    build: .
    ports:
      - "11434:11434"
      - "9090:9090"
      - "8080:8080"
    volumes:
      - mesh-data:/root
    environment:
      - CONFIG_PATH=/root/config.yaml
    networks:
      - mesh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mesh

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/ollama-mesh.json:/var/lib/grafana/dashboards/ollama-mesh.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mesh

volumes:
  mesh-data:
  prometheus-data:
  grafana-data:

networks:
  mesh:
    driver: bridge
