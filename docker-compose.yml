services:
  ollama-mesh:
    image: ghcr.io/anirudhx7/ollama-mesh:latest
    ports:
      - "11434:11434"
      - "9090:9090"
      - "8080:8080"
    volumes:
      - mesh-data:/data
    environment:
      - MESH_DB_PATH=/data/mesh.db
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mesh-data:
