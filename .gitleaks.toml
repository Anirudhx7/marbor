[extend]
useDefault = true

# Confirmed false positives from a full-history scan (see git log for verification
# notes): doc/demo placeholders, curl-auth-header noise on plain doc curl examples,
# and Go test fixtures with fixed literal tokens. Single global allowlist - this
# gitleaks version (8.24.3) requires [allowlist] as a map, not [[allowlist]].
[allowlist]
description = "Doc/demo placeholders and test fixtures, never live credentials"
paths = [
  '''docs/.*''',
  '''website/docs/.*''',
  '''README\.md''',
  '''config\.example\.yaml''',
  '''ui/src/lib/mockData\.ts''',
  '''internal/admin/web/index\.html''',
]
regexes = [
  '''sk-prod-abcdef1234567890abcdef1234567890abcdef12''',
  '''sk-agent-test-token''',
  '''readonly\.Xk9fA1b2C3d4''',
  '''operator\.Xk9fA1b2C3d4''',
  '''admin\.Xk9fA1b2C3d4''',
  '''sekret-marbor-agent-token''',
]
