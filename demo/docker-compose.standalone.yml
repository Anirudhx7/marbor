  demo_prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      
      scrape_configs:
        - job_name: 'marbor'
          static_configs:
            - targets: ['marbor:9090']
  demo_grafana_datasource:
    content: |
      apiVersion: 1
      
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
