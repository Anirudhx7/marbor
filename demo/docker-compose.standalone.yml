# Project name pinned so it does not depend on the directory this file lives in.
name: marbor-demo

# Self-contained public demo. Copy just this one file (no repo clone) and run:
#   docker compose -f docker-compose.standalone.yml up -d
# All node/marbor/traffic-gen images are pulled from GHCR; the demo database
# and all config files (Prometheus scrape config, Grafana provisioning +
# dashboard) are inlined below via Compose 'configs: content:' - nothing
# extra to fetch.
#
# For local development, use demo/docker-compose.yml + `make demo` instead -
# that one builds from source so it tests your working tree.
services:
  ollama-node-a:
    image: ghcr.io/anirudhx7/marbor-mocknode:latest
    environment:
      RUNTIME: ollama
      NODE_NAME: node-a
      WARM_MODELS: llama3.2:3b,qwen2.5:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "120"
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-node-b:
    image: ghcr.io/anirudhx7/marbor-mocknode:latest
    environment:
      RUNTIME: ollama
      NODE_NAME: node-b
      WARM_MODELS: mistral:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "180"
    ports:
      - "11436:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Multi-runtime demo nodes  --  vLLM/TGI/llama.cpp mocks satisfying exactly
  # what internal/runtime's detect/health probes expect (see cmd/mocknode's
  # package comment), not each project's full real API surface. Not part of
  # smoke.sh's default gate (that only checks the 2 Ollama nodes + marbor);
  # started via `make demo` or explicitly with `docker compose -f
  # demo/docker-compose.yml up -d vllm-node tgi-node llamacpp-node`.
  vllm-node:
    image: ghcr.io/anirudhx7/marbor-mocknode:latest
    environment:
      RUNTIME: vllm
      NODE_NAME: vllm-node
      PORT: "11434"
      LATENCY_MS: "200"
    ports:
      - "11437:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tgi-node:
    image: ghcr.io/anirudhx7/marbor-mocknode:latest
    environment:
      RUNTIME: tgi
      NODE_NAME: tgi-node
      PORT: "11434"
      LATENCY_MS: "160"
    ports:
      - "11438:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  llamacpp-node:
    image: ghcr.io/anirudhx7/marbor-mocknode:latest
    environment:
      RUNTIME: llamacpp
      NODE_NAME: llamacpp-node
      PORT: "11434"
      LATENCY_MS: "140"
    ports:
      - "11439:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # marbor deliberately does NOT depend_on the 3 multi-runtime nodes above:
  # docker compose auto-starts a service's depends_on targets even when they
  # weren't named explicitly, which would silently make smoke.sh (which only
  # asks for `ollama-node-a ollama-node-b marbor`) start 3 extra containers.
  # The router already handles a configured-but-not-yet-up node gracefully
  # (marks it unhealthy until it responds), so marbor can start without them.
  marbor:
    image: ghcr.io/anirudhx7/marbor:latest
    depends_on:
      ollama-node-a:
        condition: service_healthy
      ollama-node-b:
        condition: service_healthy

    command: sh -c "base64 -d /demo/marbor.demo.db.b64 > /root/marbor.db && exec ./marbor"
    configs:
      - source: demo_marbor_db
        target: /demo/marbor.demo.db.b64
    # 8080 (admin dashboard, factory admin/admin credentials) and 9090
    # (unauthenticated metrics) are bound to loopback only - this file's
    # documented deployment shape is a fresh cloud VM, where publishing them
    # on all interfaces hands any internet scanner a live admin session.
    # View the dashboard via an SSH tunnel instead:
    #   ssh -L 8080:localhost:8080 <user>@<vm-host>
    # then open http://localhost:8080 on your own machine. 11434 (the
    # Ollama-compatible proxy) stays open - it requires demo-api-key.
    ports:
      - "11434:11434"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Runs the 20-request demo load inside Docker so the demo needs only Docker,
  # never a local Go toolchain. Started on demand via `docker compose run`.
  demotraffic:
    image: ghcr.io/anirudhx7/marbor-demotraffic:latest
    depends_on:
      marbor:
        condition: service_healthy
    environment:
      PROXY_URL: http://marbor:11434
      API_KEY: demo-api-key
      REQUEST_COUNT: "20"
      # See demo/docker-compose.yml's identical setting for why: this
      # targets the "marbor" compose service's Docker DNS name, still the
      # same self-contained local stack demotraffic's localhost guard exists
      # to protect against pointing at a real live instance.
      ALLOW_NON_LOCALHOST: "1"
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    configs:
      - source: demo_prometheus_config
        target: /etc/prometheus/prometheus.yml
    depends_on:
      marbor:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    configs:
      - source: demo_grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: demo_grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: demo_grafana_dashboard_json
        target: /var/lib/grafana/dashboards/marbor.json
    depends_on:
      - prometheus

