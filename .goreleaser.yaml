version: 2

project_name: ollama-mesh

# The UI is embedded into the binary via go:embed, so it must be built first.
before:
  hooks:
    - npm --prefix ui ci
    - npm --prefix ui run build

builds:
  - id: ollama-mesh
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

# Raw binaries (not tarballs) so the README one-liner works:
# curl -Lo ollama-mesh .../releases/latest/download/ollama-mesh-linux-amd64
archives:
  - id: ollama-mesh
    ids: [ollama-mesh]
    formats: ['binary']
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: 'checksums.txt'

dockers:
  - image_templates:
      - ghcr.io/anirudhx7/ollama-mesh:{{ .Version }}
      - ghcr.io/anirudhx7/ollama-mesh:latest
    dockerfile: Dockerfile.goreleaser
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: Anirudhx7
    name: ollama-mesh
  # Man pages (docs/man/*.1, generated by cmd/gen-docs - see `make docs`) are
  # uploaded as individual release assets alongside the binaries, at the same
  # "releases/latest/download/<name>" URL pattern install.sh already uses for
  # the binary. install.sh has no source checkout to copy docs/man/*.1 from,
  # so it fetches them from here instead - best-effort, non-fatal to the
  # install (see install.sh's install_man_pages).
  #
  # docs/man/MANIFEST.txt (also generated by cmd/gen-docs, listing exactly
  # which *.1 filenames this release shipped) is uploaded as the same kind of
  # release asset so install.sh can fetch it first and learn the current file
  # list instead of relying on its own hardcoded MAN_PAGES fallback.
  extra_files:
    - glob: docs/man/*.1
    - glob: docs/man/MANIFEST.txt
