version: 2

project_name: marbor

# The UI is embedded into the binary via go:embed, so it must be built first.
before:
  hooks:
    - npm --prefix ui ci
    - npm --prefix ui run build
    # The man-pages archive below globs docs/man/*.1 - goreleaser does not error
    # on a non-matching glob, so a checkout missing generated docs (see
    # `make docs`) would otherwise ship a release with an empty archive instead
    # of failing the release outright.
    - sh -c 'test -s docs/man/marbor.1 || (echo "docs/man/marbor.1 missing - run make docs and commit the result" >&2; exit 1)'

builds:
  - id: marbor
    main: ./cmd/marbor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}
  # Marbor Agent: a separate artifact so a GPU/marbor-agent host installs a
  # binary with no control-plane startup path at all - see the "Control
  # Plane / Marbor Agent Binary Separation" work item. Same version, same
  # release, same OS/arch matrix as the marbor build above; only the
  # entry point (cmd/marbor-agent) differs.
  - id: marbor-agent
    main: ./cmd/marbor-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

# Raw binaries (not tarballs) so the README one-liner works:
# curl -Lo marbor .../releases/latest/download/marbor-linux-amd64
archives:
  - id: marbor
    ids: [marbor]
    formats: ['binary']
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'
  - id: marbor-agent
    ids: [marbor-agent]
    formats: ['binary']
    name_template: 'marbor-agent-{{ .Os }}-{{ .Arch }}'
  # Man pages (docs/man/*.1, generated by cmd/gen-docs - see `make docs`) ship
  # as ONE archive instead of a loose asset per page. meta: true builds an
  # archive of only the listed files, no binaries. The layout is man1/<page>.1,
  # the same shape other projects use for man-page tarballs, so a packager or
  # admin can unpack it straight into a man root:
  #   tar -xzf marbor-man-pages.tar.gz -C /usr/local/share/man
  # The name has no version, like the binaries above, so install.sh can fetch
  # it from releases/latest/download. It is covered by checksums.txt.
  - id: man-pages
    meta: true
    formats: ['tar.gz']
    name_template: 'marbor-man-pages'
    files:
      - src: docs/man/*.1
        dst: man1
        strip_parent: true

checksum:
  name_template: 'checksums.txt'

dockers:
  - image_templates:
      - ghcr.io/anirudhx7/marbor:{{ .Version }}-amd64
    dockerfile: Dockerfile.goreleaser
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
  - image_templates:
      - ghcr.io/anirudhx7/marbor:{{ .Version }}-arm64
    dockerfile: Dockerfile.goreleaser
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64

docker_manifests:
  - name_template: ghcr.io/anirudhx7/marbor:{{ .Version }}
    image_templates:
      - ghcr.io/anirudhx7/marbor:{{ .Version }}-amd64
      - ghcr.io/anirudhx7/marbor:{{ .Version }}-arm64
  - name_template: ghcr.io/anirudhx7/marbor:latest
    image_templates:
      - ghcr.io/anirudhx7/marbor:{{ .Version }}-amd64
      - ghcr.io/anirudhx7/marbor:{{ .Version }}-arm64

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: Anirudhx7
    name: marbor
