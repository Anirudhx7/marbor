name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ollama-mesh version
      placeholder: v0.2.1 (or commit hash)
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      placeholder: "e.g. 1 Ollama node + OpenAI fallback, Docker Compose, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant proxy output, response bodies, or dashboard state. Redact API keys.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Settings JSON (redacted)
      description: Your /api/settings payload or custom database configuration (with keys redacted).
      render: json
