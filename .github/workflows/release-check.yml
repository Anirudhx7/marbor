name: Release check

# Builds the release the way the release workflow would (goreleaser snapshot:
# binaries, man-page archive, checksums and the Docker images) and checks what
# came out with scripts/release-check.sh. Nothing is published.
#
# Three triggers, none of which need anyone to remember anything:
#   - release.yml calls this before it publishes, so a tag that would ship a
#     broken release stops here instead of reaching users.
#   - it runs on pull requests that touch release packaging (including the
#     version bump in a release PR), so the problem shows up in review rather
#     than at tag time.
#   - it runs weekly on main, so drift nobody is touching the packaging for (a
#     new base image, a goreleaser or action update, a dependency change) is
#     caught between releases instead of on the day of one. A failed scheduled
#     run is reported to the repository admins by GitHub.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - 'Dockerfile'
      - 'Dockerfile.goreleaser'
      - 'install.sh'
      - 'uninstall.sh'
      - 'docs/man/**'
      - 'cmd/gen-docs/**'
      - 'cmd/marbor/**'
      - 'cmd/marbor-agent/**'
      - 'go.mod'
      - 'go.sum'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'scripts/release-check.sh'
      - '.github/workflows/release-check.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Set up QEMU
        # The release builds an arm64 image on an amd64 runner.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build the release without publishing it
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=announce

      - name: Check the built release
        run: bash scripts/release-check.sh
