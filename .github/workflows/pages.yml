name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; don't cancel in-progress so a queued
# deploy isn't aborted mid-flight (that's what caused the prior timeouts).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job only checks out code and runs npm ci/build - it never needs
    # the Pages/OIDC permissions that only `deploy` actually uses.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Get version
        id: version
        run: |
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          if [ -z "$version" ]; then
            version="$(node -p "require('./ui/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        working-directory: ui
        env:
          VITE_FORCE_DEMO: 'true'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Assemble site (landing page + demo)
        run: |
          mkdir -p site/demo
          # Dashboard demo goes under /demo/
          cp -r ui/dist/. site/demo/
          # Real Grafana dashboard JSON so the demo's download button works
          mkdir -p site/demo/grafana
          cp grafana/marbor.json site/demo/grafana/marbor.json
          # Create SPA 404 fallback inside demo/
          cp site/demo/index.html site/demo/404.html
          # Build docs HTML from markdown source
          cd website && node build-docs.mjs && cd ..
          # Landing page (website/) becomes the root
          cp -r website/. site/
          # Root 404 redirects to landing page
          cp website/404.html site/404.html 2>/dev/null || cp website/index.html site/404.html
          # Inject version token into all HTML files
          find site -name "*.html" -exec sed -i "s/{{VERSION}}/v${{ steps.version.outputs.version }}/g" {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required for actions/deploy-pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # Notify IndexNow-participating engines (Bing, Yandex, DuckDuckGo, Seznam)
      # that content changed, so they re-crawl within minutes instead of days.
      # Google ignores IndexNow (it re-crawls via the sitemap / Search Console).
      # Non-fatal: a hiccup here must never fail the deploy.
      - name: Notify IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{
              "host": "marbor.in",
              "key": "66f428c36813423b9f86e3cdb81b26bd",
              "keyLocation": "https://marbor.in/66f428c36813423b9f86e3cdb81b26bd.txt",
              "urlList": [
                "https://marbor.in/",
                "https://marbor.in/docs/",
                "https://marbor.in/docs/USE-CASES.html",
                "https://marbor.in/docs/INTEGRATIONS.html",
                "https://marbor.in/docs/PRODUCTION.html",
                "https://marbor.in/docs/SAVINGS-MATH.html",
                "https://marbor.in/docs/LIMITATIONS.html",
                "https://marbor.in/docs/guides/load-balance-vllm-servers.html",
                "https://marbor.in/docs/guides/one-endpoint-for-several-ollama-machines.html",
                "https://marbor.in/docs/guides/several-llama-cpp-servers-one-endpoint.html",
                "https://marbor.in/docs/guides/mac-fleet-mlx-one-endpoint.html",
                "https://marbor.in/docs/guides/per-key-quotas-self-hosted-llm.html",
                "https://marbor.in/docs/guides/when-every-gpu-is-busy.html",
                "https://marbor.in/docs/guides/monitor-llm-fleet-prometheus-grafana.html",
                "https://marbor.in/docs/guides/drain-gpu-node-without-downtime.html"
              ]
            }' || true

      # Cloudflare caches HTML at the edge for an hour; purge it so a fresh
      # deploy is visible immediately. Skipped when the secrets are absent
      # (forks) and non-fatal so a Cloudflare hiccup never fails the deploy.
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare secrets not set; skipping purge"
            exit 0
          fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache"             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Content-Type: application/json"             --data '{"purge_everything":true}' || true
