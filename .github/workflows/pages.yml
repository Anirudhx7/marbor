name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./ui/package.json').version")" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build
        working-directory: ui
        env:
          VITE_FORCE_DEMO: 'true'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Assemble site (landing page + demo)
        run: |
          mkdir -p site/demo
          # Dashboard demo goes under /demo/
          cp -r ui/dist/. site/demo/
          # Create SPA 404 fallback inside demo/
          cp site/demo/index.html site/demo/404.html
          # Landing page (website/) becomes the root
          cp -r website/. site/
          # Inject version into landing page badge
          sed -i "s/{{VERSION}}/v${{ steps.version.outputs.version }}/g" site/index.html
          # Root 404 redirects to landing page
          cp website/404.html site/404.html 2>/dev/null || cp website/index.html site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
