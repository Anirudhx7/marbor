name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Required for actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress so a queued
# deploy isn't aborted mid-flight (that's what caused the prior timeouts).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Get version
        id: version
        run: |
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          if [ -z "$version" ]; then
            version="$(node -p "require('./ui/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        working-directory: ui
        env:
          VITE_FORCE_DEMO: 'true'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Assemble site (landing page + demo)
        run: |
          mkdir -p site/demo
          # Dashboard demo goes under /demo/
          cp -r ui/dist/. site/demo/
          # Create SPA 404 fallback inside demo/
          cp site/demo/index.html site/demo/404.html
          # Build docs HTML from markdown source
          cd website && node build-docs.mjs && cd ..
          # Landing page (website/) becomes the root
          cp -r website/. site/
          # Root 404 redirects to landing page
          cp website/404.html site/404.html 2>/dev/null || cp website/index.html site/404.html
          # Inject version token into all HTML files
          find site -name "*.html" -exec sed -i "s/{{VERSION}}/v${{ steps.version.outputs.version }}/g" {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # The github-pages environment only permits deploys from main branch.
    # Tag pushes trigger build (to get the right git-describe version) but skip deploy.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

