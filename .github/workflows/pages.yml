name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Get version
        id: version
        run: |
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          if [ -z "$version" ]; then
            version="$(node -p "require('./ui/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        working-directory: ui
        env:
          VITE_FORCE_DEMO: 'true'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Assemble site (landing page + demo)
        run: |
          mkdir -p site/demo
          # Dashboard demo goes under /demo/
          cp -r ui/dist/. site/demo/
          # Create SPA 404 fallback inside demo/
          cp site/demo/index.html site/demo/404.html
          # Build docs HTML from markdown source
          cd website && node build-docs.mjs && cd ..
          # Landing page (website/) becomes the root
          cp -r website/. site/
          # Root 404 redirects to landing page
          cp website/404.html site/404.html 2>/dev/null || cp website/index.html site/404.html
          # Inject version token into all HTML files
          find site -name "*.html" -exec sed -i "s/{{VERSION}}/v${{ steps.version.outputs.version }}/g" {} \;

      - name: Publish site to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy GitHub Pages for ${GITHUB_SHA}"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
