name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress so a queued
# deploy isn't aborted mid-flight (that's what caused the prior timeouts).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Get version
        id: version
        run: |
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          if [ -z "$version" ]; then
            version="$(node -p "require('./ui/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        working-directory: ui
        env:
          VITE_FORCE_DEMO: 'true'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Assemble site (landing page + demo)
        run: |
          mkdir -p site/demo
          # Dashboard demo goes under /demo/
          cp -r ui/dist/. site/demo/
          # Real Grafana dashboard JSON so the demo's download button works
          mkdir -p site/demo/grafana
          cp grafana/ollama-mesh.json site/demo/grafana/ollama-mesh.json
          # Create SPA 404 fallback inside demo/
          cp site/demo/index.html site/demo/404.html
          # Build docs HTML from markdown source
          cd website && node build-docs.mjs && cd ..
          # Landing page (website/) becomes the root
          cp -r website/. site/
          # Root 404 redirects to landing page
          cp website/404.html site/404.html 2>/dev/null || cp website/index.html site/404.html
          # Inject version token into all HTML files
          find site -name "*.html" -exec sed -i "s/{{VERSION}}/v${{ steps.version.outputs.version }}/g" {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Notify IndexNow-participating engines (Bing, Yandex, DuckDuckGo, Seznam)
      # that content changed, so they re-crawl within minutes instead of days.
      # Google ignores IndexNow (it re-crawls via the sitemap / Search Console).
      # Non-fatal: a hiccup here must never fail the deploy.
      - name: Notify IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{
              "host": "anirudh.social",
              "key": "66f428c36813423b9f86e3cdb81b26bd",
              "keyLocation": "https://anirudh.social/ollama-mesh/66f428c36813423b9f86e3cdb81b26bd.txt",
              "urlList": [
                "https://anirudh.social/ollama-mesh/",
                "https://anirudh.social/ollama-mesh/docs/",
                "https://anirudh.social/ollama-mesh/docs/USE-CASES.html",
                "https://anirudh.social/ollama-mesh/docs/INTEGRATIONS.html",
                "https://anirudh.social/ollama-mesh/docs/PRODUCTION.html",
                "https://anirudh.social/ollama-mesh/docs/SAVINGS-MATH.html",
                "https://anirudh.social/ollama-mesh/docs/LIMITATIONS.html"
              ]
            }' || true

