name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect demo image changes since last tag
        id: demo-changes
        run: |
          check_changed() {
            local image="$1"; shift
            if ! docker buildx imagetools inspect "ghcr.io/anirudhx7/$image:latest" >/dev/null 2>&1; then
              echo "$image:latest not found in GHCR yet; building." >&2
              echo true
              return
            fi
            if [ -z "$PREV_TAG" ]; then
              echo true
              return
            fi
            if echo "$CHANGED" | grep -qE "$1"; then echo true; else echo false; fi
          }
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          CHANGED=""
          [ -n "$PREV_TAG" ] && CHANGED=$(git diff --name-only "$PREV_TAG" "${{ github.ref_name }}")
          echo "mocknode=$(check_changed marbor-mocknode '^(cmd/mocknode/|Dockerfile\.mocknode$|go\.mod$|go\.sum$)')" >> "$GITHUB_OUTPUT"
          echo "demotraffic=$(check_changed marbor-demotraffic '^(cmd/demotraffic/|Dockerfile\.demotraffic$|go\.mod$|go\.sum$)')" >> "$GITHUB_OUTPUT"

      - name: Build and push mocknode image
        if: steps.demo-changes.outputs.mocknode == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.mocknode
          push: true
          tags: |
            ghcr.io/anirudhx7/marbor-mocknode:latest
            ghcr.io/anirudhx7/marbor-mocknode:${{ github.ref_name }}

      - name: Build and push demotraffic image
        if: steps.demo-changes.outputs.demotraffic == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.demotraffic
          push: true
          tags: |
            ghcr.io/anirudhx7/marbor-demotraffic:latest
            ghcr.io/anirudhx7/marbor-demotraffic:${{ github.ref_name }}

      - name: Trigger Pages Deploy
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
