name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Fastest signal first: vet + gofmt + race tests. Independent of the UI build -
  # Go compiles against the committed internal/admin/web embed, not ui/dist.
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Stub UI embed dir
        # go:embed web/dist in internal/admin/admin.go requires the dir to exist at
        # compile time. It's gitignored (built by `npm run build`), and this job is
        # intentionally UI-build-independent, so create an empty stub - mirrors the
        # Makefile's `test` target.
        run: |
          mkdir -p internal/admin/web/dist/assets
          touch internal/admin/web/dist/index.html

      - name: Go vet
        run: go vet ./...

      - name: gofmt check
        # Fail fast if any file is not gofmt-formatted. Print offenders for easy fix.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go Tests (race detector)
        # -race catches concurrent map/mutex bugs (shared state in auth, router, admin).
        # Timeout guards against hangs in integration tests. internal/admin alone already
        # runs ~120s under -race (many NewServer-per-test integration tests), so 120s left
        # no real margin - bumped to 300s to absorb normal CI runner variance without
        # weakening the hang-detection this timeout exists for.
        run: go test -race -timeout 300s ./...

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install UI Dependencies and Build
        working-directory: ./ui
        run: |
          npm ci
          npm run build

      - name: Build demo mode (GitHub Pages regression check)
        working-directory: ./ui
        run: npm run build
        env:
          VITE_FORCE_DEMO: 'true'
          VITE_APP_VERSION: ${{ github.ref_name }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        # Blocking: a known vuln in a direct dep should fail CI, not be silently skipped.
        # If this becomes noisy due to false positives in indirect deps, add continue-on-error: true.
        run: govulncheck ./...

  smoke:
    # Real-binary e2e: builds the actual demo stack, sends real HTTP through the proxy,
    # asserts auth/routing/streaming/admin/metrics. Unit tests + race detector don't prove
    # the binary boots and routes - this catches "compiles but doesn't run" before docker-main.
    # Acceptance bar (EXECUTION-QUEUE.md item 1) is "< 5 min" - a hard timeout keeps a stuck
    # compose stack from silently burning the 360-minute default instead of failing fast.
    needs: [go-checks, ui-build, govulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Stub UI embed dir
        # smoke.sh's mesh.demo.db drift check does a bare `go build` on the runner (outside
        # Docker) to trigger migrate() - go:embed web/dist in admin.go needs the dir to exist
        # at compile time on a fresh checkout, same as the go-checks job above.
        run: |
          mkdir -p internal/admin/web/dist/assets
          touch internal/admin/web/dist/index.html

      - name: Run smoke test
        run: bash scripts/smoke.sh

  docker-main:
    # Bleeding-edge image for testing: ghcr.io/anirudhx7/ollama-mesh:main
    # Stable releases keep :latest and :vX.Y.Z via goreleaser on v* tags.
    # Runs only after all check lanes are green, and only on pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-checks, ui-build, govulncheck, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push main image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/anirudhx7/ollama-mesh:main
            ghcr.io/anirudhx7/ollama-mesh:main-${{ steps.sha.outputs.short }}
