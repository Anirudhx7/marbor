name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI Dependencies and Build
        working-directory: ./ui
        run: |
          npm ci
          npm run build

      - name: Build demo mode (GitHub Pages regression check)
        working-directory: ./ui
        run: npm run build
        env:
          VITE_FORCE_DEMO: 'true'
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Go vet
        run: go vet ./...

      - name: gofmt check
        # Fail fast if any file is not gofmt-formatted. Print offenders for easy fix.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go Tests (race detector)
        # -race catches concurrent map/mutex bugs (shared state in auth, router, admin).
        # Timeout guards against hangs in integration tests.
        run: go test -race -timeout 120s ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        # Blocking: a known vuln in a direct dep should fail CI, not be silently skipped.
        # If this becomes noisy due to false positives in indirect deps, add continue-on-error: true.
        run: govulncheck ./...
