name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI Dependencies and Build
        working-directory: ./ui
        run: |
          npm ci
          npm run build

      - name: Build demo mode (GitHub Pages regression check)
        working-directory: ./ui
        run: npm run build
        env:
          VITE_FORCE_DEMO: 'true'
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Run Go Tests
        run: go test ./...
