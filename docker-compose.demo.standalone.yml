            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
            "id": 5,
            "options": {
              "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
              "tooltip": { "mode": "multi", "sort": "desc" }
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "$${datasource}" },
                "expr": "sum by (model) (rate(ollamamesh_requests_total[1m]))",
                "legendFormat": "{{model}}",
                "refId": "A"
              }
            ],
            "title": "Requests/s by Model",
            "type": "timeseries"
          },
          {
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "fieldConfig": {
              "defaults": {
                "color": { "mode": "palette-classic" },
                "custom": {
                  "axisCenteredZero": false,
                  "axisColorMode": "text",
                  "axisLabel": "",
                  "axisPlacement": "auto",
                  "barAlignment": 0,
                  "drawStyle": "line",
                  "fillOpacity": 10,
                  "gradientMode": "none",
                  "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                  "lineInterpolation": "linear",
                  "lineWidth": 1,
                  "pointSize": 5,
                  "scaleDistribution": { "type": "linear" },
                  "showPoints": "never",
                  "spanNulls": false,
                  "stacking": { "group": "A", "mode": "none" },
                  "thresholdsStyle": { "mode": "off" }
                },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [{ "color": "green", "value": null }]
                },
                "unit": "reqps"
              },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
            "id": 6,
            "options": {
              "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
              "tooltip": { "mode": "multi", "sort": "desc" }
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "$${datasource}" },
                "expr": "sum by (node) (rate(ollamamesh_requests_total[1m]))",
                "legendFormat": "{{node}}",
                "refId": "A"
              }
            ],
