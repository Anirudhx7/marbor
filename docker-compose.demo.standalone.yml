                "unit": "short"
              },
              "overrides": []
            },
            "gridPos": { "h": 4, "w": 6, "x": 12, "y": 24 },
            "id": 10,
            "options": {
              "colorMode": "background",
              "graphMode": "none",
              "justifyMode": "auto",
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
