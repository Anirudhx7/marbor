# Self-contained public demo. Copy just this one file (no repo clone) and run:
#   docker compose -f docker-compose.demo.standalone.yml up -d
# All node/mesh/traffic-gen images are pulled from GHCR; all config files
# (mesh config, Prometheus scrape config, Grafana provisioning + dashboard)
# are inlined below via Compose 'configs: content:' - nothing extra to fetch.
#
# For local development, use docker-compose.demo.yml + `make demo` instead -
# that one builds from source so it tests your working tree.
services:
  ollama-node-a:
    image: ghcr.io/anirudhx7/ollama-mesh-mocknode:latest
    environment:
      RUNTIME: ollama
      NODE_NAME: node-a
      WARM_MODELS: llama3.2:3b,qwen2.5:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "120"
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-node-b:
    image: ghcr.io/anirudhx7/ollama-mesh-mocknode:latest
    environment:
      RUNTIME: ollama
      NODE_NAME: node-b
      WARM_MODELS: mistral:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "180"
    ports:
      - "11436:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Multi-runtime demo nodes  --  vLLM/TGI/llama.cpp mocks satisfying exactly
  # what internal/runtime's detect/health probes expect (see cmd/mocknode's
  # package comment), not each project's full real API surface. Not part of
  # smoke.sh's default gate (that only checks the 2 Ollama nodes + mesh);
  # started via `make demo` or explicitly with `docker compose -f
  # docker-compose.demo.yml up -d vllm-node tgi-node llamacpp-node`.
  vllm-node:
    image: ghcr.io/anirudhx7/ollama-mesh-mocknode:latest
    environment:
      RUNTIME: vllm
      NODE_NAME: vllm-node
      PORT: "11434"
      LATENCY_MS: "200"
    ports:
      - "11437:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tgi-node:
    image: ghcr.io/anirudhx7/ollama-mesh-mocknode:latest
    environment:
      RUNTIME: tgi
      NODE_NAME: tgi-node
      PORT: "11434"
      LATENCY_MS: "160"
    ports:
      - "11438:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  llamacpp-node:
    image: ghcr.io/anirudhx7/ollama-mesh-mocknode:latest
    environment:
      RUNTIME: llamacpp
      NODE_NAME: llamacpp-node
      PORT: "11434"
      LATENCY_MS: "140"
    ports:
      - "11439:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # mesh deliberately does NOT depend_on the 3 multi-runtime nodes above:
  # docker compose auto-starts a service's depends_on targets even when they
  # weren't named explicitly, which would silently make smoke.sh (which only
  # asks for `ollama-node-a ollama-node-b mesh`) start 3 extra containers.
  # The router already handles a configured-but-not-yet-up node gracefully
  # (marks it unhealthy until it responds), so mesh can start without them.
  mesh:
    image: ghcr.io/anirudhx7/ollama-mesh:latest
    depends_on:
      ollama-node-a:
        condition: service_healthy
      ollama-node-b:
        condition: service_healthy

    command: sh -c "cp /demo/mesh.demo.db /root/mesh.db && exec ./ollama-mesh"
    volumes:
      - ./mesh.demo.db:/demo/mesh.demo.db:ro
    ports:
      - "11434:11434"
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Runs the 20-request demo load inside Docker so the demo needs only Docker,
  # never a local Go toolchain. Started on demand via `docker compose run`.
  demotraffic:
    image: ghcr.io/anirudhx7/ollama-mesh-demotraffic:latest
    depends_on:
      mesh:
        condition: service_healthy
    environment:
      PROXY_URL: http://mesh:11434
      API_KEY: demo-api-key
      REQUEST_COUNT: "20"
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    configs:
      - source: demo_prometheus_config
        target: /etc/prometheus/prometheus.yml
    depends_on:
      mesh:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    configs:
      - source: demo_grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: demo_grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: demo_grafana_dashboard_json
        target: /var/lib/grafana/dashboards/ollama-mesh.json
    depends_on:
      - prometheus

configs:
  demo_prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      
      scrape_configs:
        - job_name: 'ollama-mesh'
          static_configs:
            - targets: ['ollama-mesh:9090', 'mesh:9090']
  demo_grafana_datasource:
    content: |
      apiVersion: 1
      
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
  demo_grafana_dashboard_provider:
    content: |
      apiVersion: 1
      
      providers:
        - name: 'Ollama Mesh Dashboards'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards
  demo_grafana_dashboard_json:
    content: |
      {
        "__inputs": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "description": "ollama-mesh Prometheus datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "pluginName": "Prometheus"
          }
        ],
        "__requires": [
          {
            "type": "grafana",
            "id": "grafana",
            "name": "Grafana",
            "version": "10.0.0"
          },
          {
            "type": "datasource",
            "id": "prometheus",
            "name": "Prometheus",
            "version": "1.0.0"
          },
          {
            "type": "panel",
            "id": "stat",
            "name": "Stat",
            "version": ""
          },
          {
            "type": "panel",
            "id": "timeseries",
            "name": "Time series",
            "version": ""
          }
        ],
        "annotations": {
          "list": []
        },
        "description": "GPU-aware Ollama reverse proxy - requests, latency, routing, and node health",
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 1,
        "id": null,
        "links": [],
        "panels": [
          {
            "collapsed": false,
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
            "id": 100,
            "title": "Overview",
            "type": "row"
          },
          {
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "fieldConfig": {
              "defaults": {
                "color": { "mode": "thresholds" },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null }
                  ]
                },
                "unit": "short"
              },
              "overrides": []
            },
            "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
            "id": 1,
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "textMode": "auto"
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "$${datasource}" },
                "expr": "sum(ollamamesh_requests_total)",
                "legendFormat": "Total Requests",
                "refId": "A"
              }
            ],
            "title": "Total Requests",
            "type": "stat"
          },
          {
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "fieldConfig": {
              "defaults": {
                "color": { "mode": "thresholds" },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 10 },
                    { "color": "red", "value": 50 }
                  ]
                },
                "unit": "reqps"
              },
              "overrides": []
            },
            "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
            "id": 2,
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "justifyMode": "auto",
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "textMode": "auto"
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "$${datasource}" },
                "expr": "sum(rate(ollamamesh_requests_total[1m]))",
                "legendFormat": "Request Rate",
                "refId": "A"
              }
            ],
            "title": "Request Rate (1m)",
            "type": "stat"
          },
          {
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "fieldConfig": {
              "defaults": {
                "color": { "mode": "thresholds" },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 1 },
                    { "color": "red", "value": 5 }
                  ]
                },
                "unit": "percent"
              },
              "overrides": []
            },
            "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
            "id": 3,
            "options": {
              "colorMode": "background",
              "graphMode": "none",
              "justifyMode": "auto",
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "textMode": "auto"
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "$${datasource}" },
                "expr": "100 * sum(rate(ollamamesh_requests_total{status=~\"5..\"}[1m])) / sum(rate(ollamamesh_requests_total[1m]))",
                "legendFormat": "Error Rate %",
                "refId": "A"
              }
            ],
            "title": "Error Rate % (5xx)",
            "type": "stat"
          },
          {
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "fieldConfig": {
              "defaults": {
                "color": { "mode": "thresholds" },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 5 },
                    { "color": "red", "value": 15 }
                  ]
                },
                "unit": "s"
              },
              "overrides": []
            },
            "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
            "id": 4,
            "options": {
              "colorMode": "background",
              "graphMode": "none",
              "justifyMode": "auto",
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "textMode": "auto"
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "$${datasource}" },
                "expr": "histogram_quantile(0.99, sum by (le) (rate(ollamamesh_request_duration_seconds_bucket[5m])))",
                "legendFormat": "P99 Latency",
                "refId": "A"
              }
            ],
            "title": "P99 Latency",
            "type": "stat"
          },
          {
            "collapsed": false,
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
            "id": 101,
            "title": "Traffic",
            "type": "row"
          },
          {
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "fieldConfig": {
              "defaults": {
                "color": { "mode": "palette-classic" },
                "custom": {
                  "axisCenteredZero": false,
                  "axisColorMode": "text",
                  "axisLabel": "",
                  "axisPlacement": "auto",
                  "barAlignment": 0,
                  "drawStyle": "line",
                  "fillOpacity": 10,
                  "gradientMode": "none",
                  "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                  "lineInterpolation": "linear",
                  "lineWidth": 1,
                  "pointSize": 5,
                  "scaleDistribution": { "type": "linear" },
                  "showPoints": "never",
                  "spanNulls": false,
                  "stacking": { "group": "A", "mode": "none" },
                  "thresholdsStyle": { "mode": "off" }
                },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [{ "color": "green", "value": null }]
