proxy:
  port: 11434
  log_level: info
  # Structured JSON access log (one line per request) on stdout. Default true.
  # Logs key NAME (never the key value), model, node, status, latency, request id.
  access_log: true

# Admin dashboard + REST API listener.
admin:
  # Listen address. Default ":8080" (all interfaces) for Docker port mapping.
  # For a hardened single-host deploy, use "127.0.0.1:8080" so the dashboard is
  # not reachable from the network (access it via SSH tunnel or a reverse proxy).
  bind_address: ":8080"
  # Access-Control-Allow-Origin for the admin API. Empty (default) sends no CORS
  # headers, so the API is only callable same-origin (the embedded dashboard).
  # Set a specific origin only if you serve a separate front-end. Avoid "*".
  cors_origin: ""

auth:
  enabled: true
  # Bearer token for the admin dashboard + /admin API. Set this explicitly:
  # if left blank, the admin token silently falls back to your first API key,
  # which would grant dashboard access to every API-key holder.
  admin_token: sk-admin-change-me
  # Per-key usage/quota counters are persisted here so they survive restarts
  # (a restart would otherwise reset quotas). Defaults to usage-state.json.
  # Set to "-" to disable persistence.
  state_path: usage-state.json
  keys:
    - name: anirudh-dev
      key: sk-mesh-abc123
      rate_limit: 1000
      models:
        - llama3.2:8b
        - codellama:13b
    - name: team-shared
      key: sk-mesh-xyz789
      rate_limit: 5000
      # Optional hard quotas (0 or omitted = unlimited). The Nth request in the
      # period succeeds; the next returns 429. Separate from rate_limit (per hour).
      daily_limit: 50000
      monthly_limit: 1000000
      models: []
    - name: agent-runner
      key: sk-mesh-agent001
      rate_limit: 500
      expires_at: "2027-01-01"

nodes:
  - name: gpu-0
    url: http://localhost:11435
    gpu_model: "NVIDIA RTX 4090 24GB"
  - name: gpu-1
    url: http://localhost:11436
    gpu_model: "NVIDIA RTX 4090 24GB"
  # Remote node example. nvidia-smi runs on the mesh host only, so a remote
  # node's used-VRAM is derived from its own /api/ps (real, live). Declaring
  # vram_total_mb lets the dashboard show headroom; omit it and capacity shows
  # as "—". The value is operator-declared, never presented as a measurement.
  - name: gpu-remote
    url: http://10.0.1.10:11434
    gpu_model: "NVIDIA A10G 24GB"
    vram_total_mb: 24576

routing:
  strategy: warm-first
  poll_interval_ms: 2000
  fallback: least-connections
  # When an upstream node fails before sending any response bytes, retry up to
  # this many alternate healthy nodes (then cloud fallback, then 502).
  max_retries: 2
  # Max wait for an upstream node to send response headers before giving up and
  # trying the next node. Covers the header phase only, not the streaming body.
  upstream_timeout_ms: 120000
  # Destructive Ollama management endpoints (/api/delete, /api/pull, /api/push,
  # /api/create, /api/copy, /api/blobs) are BLOCKED with 403 by default so an
  # inference-only API key cannot mutate models on shared backend GPU nodes.
  # Set true only for single-tenant homelab use where the caller is trusted to
  # manage models. Read-only inventory (/api/tags, /v1/models) and inference
  # (/api/generate, /api/chat, /api/embed) are always allowed.
  allow_management_endpoints: false

  # Session affinity (KV-cache / context affinity)
  # When true, requests carrying the same X-Session-ID header are routed to the
  # same backend node. The node's KV cache for that conversation stays in VRAM,
  # so subsequent turns skip re-prefill and produce the first token faster.
  # Default false — stateless routing. Safe zero value.
  session_affinity: false
  # How long an idle session pin stays valid. After this window with no requests,
  # the session is evicted and the next request re-routes normally.
  # Accepts Go duration strings: "5m", "15m", "30m", "1h". Default "10m".
  session_affinity_ttl: "10m"

metrics:
  enabled: true
  port: 9090

litellm:
  enabled: false
  url: http://localhost:4000

# Docker auto-discovery: automatically detects running ollama/ollama containers
# and registers them as nodes. Zero-config for Docker Compose setups.
docker:
  enabled: false
  socket: /var/run/docker.sock
  poll_interval_ms: 30000

# Cloud fallback: when all local Ollama nodes are busy or down,
# requests fall back to these providers in order.
# Set enabled: false to disable without removing the config.
cloud_providers:
  - name: openai-fallback
    provider: openai
    base_url: https://api.openai.com
    api_key: sk-...
    default_model: gpt-4o-mini
    cost_per_1k_tokens: 0.00015
    enabled: false
  - name: anthropic-fallback
    provider: anthropic
    base_url: https://api.anthropic.com
    api_key: sk-ant-...
    default_model: claude-haiku-4-5-20251001
    cost_per_1k_tokens: 0.00025
    enabled: false

# Webhook notifications: POST JSON to a URL when a node transitions
# between healthy and unhealthy states. Useful for Slack, PagerDuty, etc.
# If secret is set, each request includes X-Ollama-Mesh-Signature: sha256=<hmac>.
webhook:
  enabled: false
  url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  secret: ""  # optional HMAC secret

# Savings calculation: locally-served tokens are valued at this reference
# cloud rate (USD per 1K tokens) to compute the "saved vs pure cloud" figure.
# Pick the rate of the cloud model you would otherwise use. Default: 0.002.
savings:
  reference_cost_per_1k: 0.002

# Audit logging: append-only JSON-lines file of all proxy requests.
# Records: timestamp, request_id, key_name, model, node, status, latency_ms, cloud.
# Never logs API key values or request bodies.
audit:
  enabled: false
  path: audit.log
