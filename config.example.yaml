proxy:
  port: 11434
  log_level: info
  # log_format: text or json. Use "json" to emit slog JSON objects that log
  # aggregators (Loki, Datadog, Fluentd) can parse natively. Default: text.
  # Also settable via --log-format CLI flag (flag takes precedence).
  log_format: text
  # Structured JSON access log (one line per request) on stdout. Default true.
  # Logs key NAME (never the key value), model, node, status, latency, request id.
  access_log: true

# Admin dashboard + REST API listener.
admin:
  # Listen address. Default ":8080" (all interfaces) for Docker port mapping.
  # For a hardened single-host deploy, use "127.0.0.1:8080" so the dashboard is
  # not reachable from the network (access it via SSH tunnel or a reverse proxy).
  bind_address: ":8080"
  # Access-Control-Allow-Origin for the admin API. Empty (default) sends no CORS
  # headers, so the API is only callable same-origin (the embedded dashboard).
  # Set a specific origin only if you serve a separate front-end. Avoid "*".
  cors_origin: ""

auth:
  enabled: true
  # Bearer token for the admin dashboard + /admin API. Set this explicitly:
  # if left blank, the admin token silently falls back to your first API key,
  # which would grant dashboard access to every API-key holder.
  admin_token: sk-admin-change-me
  keys:
    - name: anirudh-dev
      key: sk-mesh-abc123
      rate_limit: 1000
      models:
        - llama3.2:8b
        - codellama:13b
    - name: team-shared
      key: sk-mesh-xyz789
      rate_limit: 5000
      # Optional hard quotas (0 or omitted = unlimited). The Nth request in the
      # period succeeds; the next returns 429. Separate from rate_limit (per hour).
      daily_limit: 50000
      monthly_limit: 1000000
      models: []
    - name: agent-runner
      key: sk-mesh-agent001
      rate_limit: 500
      expires_at: "2027-01-01"

nodes:
  - name: gpu-0
    url: http://localhost:11435
    gpu_model: "NVIDIA RTX 4090 24GB"
  - name: gpu-1
    url: http://localhost:11436
    gpu_model: "NVIDIA RTX 4090 24GB"
  # Remote node example. nvidia-smi runs on the mesh host only, so a remote
  # node's used-VRAM is derived from its own /api/ps (real, live). Declaring
  # vram_total_mb lets the dashboard show headroom; omit it and capacity shows
  # as "—". The value is operator-declared, never presented as a measurement.
  - name: gpu-remote
    url: http://10.0.1.10:11434
    gpu_model: "NVIDIA A10G 24GB"
    vram_total_mb: 24576
  # runtime: identifies the inference backend type. Default: "ollama".
  # Valid values: ollama, vllm, tgi, llamacpp
  # Ollama nodes use /api/ps for warm-model detection.
  # vLLM, TGI, and llama.cpp use /health + /v1/models or /info.
  # - name: vllm-node
  #   url: http://10.0.1.20:8000
  #   runtime: vllm
  #   vram_total_mb: 81920
  # - name: tgi-node
  #   url: http://10.0.1.21:8080
  #   runtime: tgi
  # - name: llamacpp-node
  #   url: http://10.0.1.22:8080
  #   runtime: llamacpp
  # Auto-detect example: ollama-mesh will probe the node and resolve the runtime
  # automatically (ollama -> tgi -> vllm/llamacpp detection order).
  # - name: unknown-node
  #   url: http://10.0.1.23:8080
  #   runtime: auto   # auto-detect backend (ollama/vllm/tgi/llamacpp)

routing:
  strategy: warm-first
  poll_interval_ms: 2000
  fallback: least-connections
  # When an upstream node fails before sending any response bytes, retry up to
  # this many alternate healthy nodes (then cloud fallback, then 502).
  max_retries: 2
  # Max wait for an upstream node to send response headers before giving up and
  # trying the next node. Covers the header phase only, not the streaming body.
  upstream_timeout_ms: 120000
  # Destructive Ollama management endpoints (/api/delete, /api/pull, /api/push,
  # /api/create, /api/copy, /api/blobs) are BLOCKED with 403 by default so an
  # inference-only API key cannot mutate models on shared backend GPU nodes.
  # Set true only for single-tenant homelab use where the caller is trusted to
  # manage models. Read-only inventory (/api/tags, /v1/models) and inference
  # (/api/generate, /api/chat, /api/embed) are always allowed.
  allow_management_endpoints: false

  # Session affinity (KV-cache / context affinity)
  # When true, requests carrying the same X-Session-ID header are routed to the
  # same backend node. The node's KV cache for that conversation stays in VRAM,
  # so subsequent turns skip re-prefill and produce the first token faster.
  # Default false — stateless routing. Safe zero value.
  session_affinity: false
  # How long an idle session pin stays valid. After this window with no requests,
  # the session is evicted and the next request re-routes normally.
  # Accepts Go duration strings: "5m", "15m", "30m", "1h". Default "10m".
  session_affinity_ttl: "10m"

  # nvidia-smi poll interval (milliseconds). nvidia-smi forks a subprocess each
  # call; polling it every 2s alongside /api/ps produces measurable CPU overhead.
  # Default 30000 (30s). Set lower only if you need near-real-time temp/power
  # data in the dashboard. /api/ps (VRAM used by loaded models) still polls at
  # poll_interval_ms — only nvidia-smi telemetry is decoupled here.
  nvidia_poll_interval_ms: 30000

  # Request queue: when all local nodes are saturated, requests queue here
  # instead of returning 503 immediately. The queue is drained as nodes free up.
  # queue_max_depth: hard cap on waiting requests. Over-limit requests skip the
  #   queue and go straight to cloud fallback or 503. Default 100.
  # queue_timeout_ms: how long a queued request waits before giving up.
  #   Default 30000 (30s). Set to match your P95 model load time.
  queue_max_depth: 100
  queue_timeout_ms: 30000

  # Health flapping hysteresis: asymmetric thresholds so a node isn't marked
  # unhealthy on one bad poll or put back into rotation on one lucky poll.
  # health_failure_threshold: consecutive failed polls before unhealthy. Default 3.
  # health_success_threshold: consecutive successful polls before healthy again
  #   after an outage. Default 2.
  health_failure_threshold: 3
  health_success_threshold: 2

# Peer-health monitor (observability only - NOT high availability).
# When enabled, reports whether the listed peer instances' /health endpoints are
# reachable, surfaced at /admin/ha/peers and in logs. It performs NO failover,
# NO shared state, and NO leader election: ollama-mesh is a single-instance
# control plane. If you run more than one instance, distributing traffic across
# them is your external TCP load balancer's (HAProxy/nginx) job, not the mesh's.
ha:
  enabled: false
  peers: []           # admin port URLs of peer instances, e.g. http://host-b:8080
  heartbeat_interval_ms: 5000
  peer_timeout_ms: 3000

metrics:
  enabled: true
  port: 9090

litellm:
  enabled: false
  url: http://localhost:4000

# Docker auto-discovery: automatically detects running ollama/ollama containers
# and registers them as nodes. Zero-config for Docker Compose setups.
docker:
  enabled: false
  socket: /var/run/docker.sock
  poll_interval_ms: 30000

# Warmup: proactively keep models loaded in VRAM so every request is warm.
# The warmer sends a zero-token /api/generate with keep_alive to each target
# node on interval_ms cadence, preventing Ollama from evicting the model.
# Without this, a model not used for OLLAMA_KEEP_ALIVE (default 5m) gets
# unloaded and the next request pays a cold-start penalty.
warmup:
  enabled: false
  interval_ms: 300000   # ping every 5 min (must be less than OLLAMA_KEEP_ALIVE)
  keep_alive: "10m"     # how long Ollama keeps the model in VRAM after each ping
  models:
    # - model: llama3.2          # keep warm on all healthy nodes
    # - model: llama3.1:8b
    #   nodes: [gpu-1, gpu-2]   # restrict to specific nodes (empty = all nodes)

# Cloud fallback: when all local Ollama nodes are busy or down,
# requests fall back to these providers in order.
# Set enabled: false to disable without removing the config.
cloud_providers:
  - name: openai-fallback
    provider: openai
    base_url: https://api.openai.com
    api_key: sk-...
    default_model: gpt-4o-mini
    cost_per_1k_tokens: 0.00015
    enabled: false
  - name: anthropic-fallback
    provider: anthropic
    base_url: https://api.anthropic.com
    api_key: sk-ant-...
    default_model: claude-haiku-4-5-20251001
    cost_per_1k_tokens: 0.00025
    enabled: false

# Global cloud spend cap: blocks new cloud-fallback dispatch once cumulative
# spend (from real per-request CostUSD, already tracked for savings/analytics)
# hits either cap. Both default to 0 (disabled). A request that would have
# gone to cloud instead gets a 503 - it never silently degrades to a
# different, cheaper model.
cloud_budget:
  daily_usd_cap: 0
  monthly_usd_cap: 0

# Webhook notifications: POST JSON to a URL when a node transitions
# between healthy and unhealthy states. Useful for Slack, PagerDuty, etc.
# If secret is set, each request includes X-Ollama-Mesh-Signature: sha256=<hmac>.
webhook:
  enabled: false
  url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  secret: ""  # optional HMAC secret

# Savings calculation: locally-served tokens are valued at this reference
# cloud rate (USD per 1K tokens) to compute the "saved vs pure cloud" figure.
# Pick the rate of the cloud model you would otherwise use. Default: 0.002.
savings:
  reference_cost_per_1k: 0.002

# Persistent storage: SQLite database for request log, analytics, counters,
# runtime-added nodes, node overrides, and API keys created via the admin API.
# All mutable operational state survives restarts. config.yaml remains the
# bootstrap seed for static settings (admin token, routing, cloud providers).
storage:
  db_path: mesh.db

# Audit logging: append-only JSON-lines file of all proxy requests.
# Records: timestamp, request_id, key_name, model, node, status, latency_ms, cloud.
# Never logs API key values or request bodies.
audit:
  enabled: false

# Hugging Face integration: optional API token for accessing private GGUF repositories
# or bypassing Hugging Face API rate limits on searches.
huggingface:
  token: ""

