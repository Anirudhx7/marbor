services:
  ollama-node-a:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: ollama
      NODE_NAME: node-a
      WARM_MODELS: llama3.2:3b,qwen2.5:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "120"
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-node-b:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: ollama
      NODE_NAME: node-b
      WARM_MODELS: mistral:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "180"
    ports:
      - "11436:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Multi-runtime demo nodes  --  vLLM/TGI/llama.cpp mocks satisfying exactly
  # what internal/runtime's detect/health probes expect (see cmd/mocknode's
  # package comment), not each project's full real API surface. Not part of
  # smoke.sh's default gate (that only checks the 2 Ollama nodes + mesh);
  # started via `make demo` or explicitly with `docker compose -f
  # docker-compose.demo.yml up -d vllm-node tgi-node llamacpp-node`.
  vllm-node:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: vllm
      NODE_NAME: vllm-node
      PORT: "11434"
      LATENCY_MS: "200"
    ports:
      - "11437:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tgi-node:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: tgi
      NODE_NAME: tgi-node
      PORT: "11434"
      LATENCY_MS: "160"
    ports:
      - "11438:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  llamacpp-node:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: llamacpp
      NODE_NAME: llamacpp-node
      PORT: "11434"
      LATENCY_MS: "140"
    ports:
      - "11439:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # mesh deliberately does NOT depend_on the 3 multi-runtime nodes above:
  # docker compose auto-starts a service's depends_on targets even when they
  # weren't named explicitly, which would silently make smoke.sh (which only
  # asks for `ollama-node-a ollama-node-b mesh`) start 3 extra containers.
  # The router already handles a configured-but-not-yet-up node gracefully
  # (marks it unhealthy until it responds), so mesh can start without them.
  mesh:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama-node-a:
        condition: service_healthy
      ollama-node-b:
        condition: service_healthy
    environment:
      CONFIG_PATH: /config.yaml
    volumes:
      - ./config.demo.yaml:/config.yaml:ro
    ports:
      - "11434:11434"
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Runs the 20-request demo load inside Docker so the demo needs only Docker,
  # never a local Go toolchain. Started on demand via `docker compose run`.
  demotraffic:
    build:
      context: .
      dockerfile: Dockerfile.demotraffic
    depends_on:
      mesh:
        condition: service_healthy
    environment:
      PROXY_URL: http://mesh:11434
      API_KEY: demo-api-key
      REQUEST_COUNT: "20"
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      mesh:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/ollama-mesh.json:/var/lib/grafana/dashboards/ollama-mesh.json:ro
    depends_on:
      - prometheus

