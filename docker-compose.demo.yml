services:
  ollama-node-a:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: ollama
      NODE_NAME: node-a
      WARM_MODELS: llama3.2:3b,qwen2.5:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "120"
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-node-b:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: ollama
      NODE_NAME: node-b
      WARM_MODELS: mistral:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "180"
    ports:
      - "11436:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Multi-runtime demo nodes  --  vLLM/TGI/llama.cpp mocks satisfying exactly
  # what internal/runtime's detect/health probes expect (see cmd/mocknode's
  # package comment), not each project's full real API surface. Part of
  # smoke.sh's default gate alongside the 2 Ollama nodes + marbor, so CI proves
  # routing/auth/streaming across all 4 supported runtimes, not just Ollama.
  vllm-node:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: vllm
      NODE_NAME: vllm-node
      PORT: "11434"
      LATENCY_MS: "200"
    ports:
      - "11437:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tgi-node:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: tgi
      NODE_NAME: tgi-node
      PORT: "11434"
      LATENCY_MS: "160"
    ports:
      - "11438:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  llamacpp-node:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: llamacpp
      NODE_NAME: llamacpp-node
      PORT: "11434"
      LATENCY_MS: "140"
    ports:
      - "11439:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mlx-node:
    build:
      context: .
      dockerfile: Dockerfile.mocknode
    environment:
      RUNTIME: mlx
      NODE_NAME: mlx-node
      PORT: "11434"
      LATENCY_MS: "130"
    ports:
      - "11440:11434"
    healthcheck:
      # mlx has no /health route (real mlx_lm.server doesn't expose one) -
      # /v1/models is the reachability signal, matching internal/runtime.MLXProbe.
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # marbor deliberately does NOT depend_on the 4 multi-runtime nodes above:
  # docker compose auto-starts a service's depends_on targets even when they
  # weren't named explicitly in an `up` command, which would make any partial
  # `up -d` invocation (e.g. bringing up just `marbor` for a manual debug
  # session) silently drag in 4 extra containers. The router already handles
  # a configured-but-not-yet-up node gracefully (marks it unhealthy until it
  # responds), so marbor can start without them. smoke.sh starts all 6
  # explicitly with `--wait` instead of relying on depends_on for this.
  marbor:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama-node-a:
        condition: service_healthy
      ollama-node-b:
        condition: service_healthy

    command: sh -c "cp /demo/marbor.demo.db /root/marbor.db && exec ./marbor"
    volumes:
      - ./marbor.demo.db:/demo/marbor.demo.db:ro
    ports:
      - "11434:11434"
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Runs the 20-request demo load inside Docker so the demo needs only Docker,
  # never a local Go toolchain. Started on demand via `docker compose run`.
  demotraffic:
    build:
      context: .
      dockerfile: Dockerfile.demotraffic
    depends_on:
      marbor:
        condition: service_healthy
    environment:
      PROXY_URL: http://marbor:11434
      API_KEY: demo-api-key
      REQUEST_COUNT: "20"
      # PROXY_URL targets the "marbor" compose service by its Docker DNS
      # name, not literally "localhost" - but it's still the same
      # self-contained, ephemeral local stack demotraffic's non-localhost
      # guard exists to protect against pointing at a real live
      # instance. Opt in explicitly for this known-safe topology.
      ALLOW_NON_LOCALHOST: "1"
    restart: "no"

  prometheus:
    # Pinned to a specific release so this demo stack doesn't silently pick
    # up a breaking upstream change. Bump deliberately.
    image: prom/prometheus:v2.53.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      marbor:
        condition: service_healthy

  grafana:
    # Pinned to a specific release, same rationale as prometheus above.
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/marbor.json:/var/lib/grafana/dashboards/marbor.json:ro
    depends_on:
      - prometheus

