services:
  ollama-node-a:
    build:
      context: .
      dockerfile: Dockerfile.mockollama
    environment:
      NODE_NAME: node-a
      WARM_MODELS: llama3.2:3b,qwen2.5:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "120"
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-node-b:
    build:
      context: .
      dockerfile: Dockerfile.mockollama
    environment:
      NODE_NAME: node-b
      WARM_MODELS: mistral:7b
      ALL_MODELS: llama3.2:3b,qwen2.5:7b,mistral:7b
      PORT: "11434"
      LATENCY_MS: "180"
    ports:
      - "11436:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mesh:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama-node-a:
        condition: service_healthy
      ollama-node-b:
        condition: service_healthy
    environment:
      CONFIG_PATH: /config.yaml
    volumes:
      - ./config.demo.yaml:/config.yaml:ro
    ports:
      - "11434:11434"
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Runs the 20-request demo load inside Docker so the demo needs only Docker,
  # never a local Go toolchain. Started on demand via `docker compose run`.
  demotraffic:
    build:
      context: .
      dockerfile: Dockerfile.demotraffic
    depends_on:
      mesh:
        condition: service_healthy
    environment:
      PROXY_URL: http://mesh:11434
      API_KEY: demo-api-key
      REQUEST_COUNT: "20"
    restart: "no"
