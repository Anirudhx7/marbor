---
# Enrolls and installs the Marbor Agent on N already-registered
# GPU nodes. This automates exactly the API call a human makes by hand on
# the dashboard's GPU Nodes page when clicking "Enable Marbor Agent"
# (POST /admin/nodes/{name}/agent), plus running the returned install
# command on the target host - see docs/deploy/node-agent-enrollment.md for
# the underlying HTTP contract this playbook wraps.
#
# This playbook does NOT register the node's runtime endpoint - a node must
# already exist in the marbor (see ansible/playbooks/register-gpus.yml) before
# its agent can be enrolled. Deliberately kept separate: registration and
# agent enrollment are two independently-idempotent operations, and you may
# want to re-run one without the other (e.g. rotate/reinstall the agent on
# an already-registered node, without touching its runtime registration).
#
# Usage:
#   ansible-playbook ansible/playbooks/install-node-agent.yml \
#     -e @my-agent-inventory.yml \
#     -e marbor_url=https://marbor.example.com \
#     -e marbor_admin_username=admin \
#     --ask-vault-pass \
#     -e @secrets.vault.yml
#
# See ansible/README.md for the full variable reference and required SSH
# access assumptions for the GPU hosts.

- name: Enroll and install the Marbor Agent
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Override on the command line (-e) or in a vars file included with -e @file.
    marbor_admin_username: admin
    poll_retries: 10
    poll_delay: 5

  vars_files:
    # Points at the example list by default so the playbook is runnable
    # out of the box against the sample data. Real runs should override
    # this whole vars_files entry (or just agent_nodes) with -e @your-file.yml.
    - ../inventory-agents.example.yml

  tasks:
    - name: Verify required variables are set
      ansible.builtin.assert:
        that:
          - marbor_url is defined
          - marbor_url | length > 0
          - marbor_admin_password is defined
          - marbor_admin_password | length > 0
          - agent_nodes is defined
          - agent_nodes | length > 0
        fail_msg: >-
          marbor_url, marbor_admin_password, and a non-empty agent_nodes list are
          required. See ansible/README.md.

    - name: Verify every agent_nodes entry has name, host, and port
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.name | length > 0
          - item.host is defined
          - item.host | length > 0
          - item.port is defined
        fail_msg: >-
          agent_nodes entries require an explicit name (must match an
          already-registered node), host, and port - none of these are
          generated/defaulted here, unlike register-gpus.yml's gpu_nodes.
          See ansible/README.md.
      loop: "{{ agent_nodes }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Log in to marbor Admin API (session reused for all nodes)
      ansible.builtin.uri:
        url: "{{ marbor_url }}/admin/login"
        method: POST
        body_format: json
        body:
          username: "{{ marbor_admin_username }}"
          password: "{{ marbor_admin_password }}"
        status_code: 200
      register: marbor_login
      no_log: true

    - name: Fetch current fleet status (used to decide agent re-enrollment)
      ansible.builtin.uri:
        url: "{{ marbor_url }}/admin/nodes"
        method: GET
        headers:
          Cookie: "{{ marbor_login.set_cookie }}"
        status_code: 200
        return_content: true
      register: fleet_status

    - name: Verify every agent_nodes entry names an already-registered node
      ansible.builtin.assert:
        that:
          - item.name in (fleet_status.json | map(attribute='name') | list)
        fail_msg: >-
          agent_nodes entry {{ item.name }} ({{ item.host }}) is not a
          registered marbor node. Run register-gpus.yml for it first.
      loop: "{{ agent_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Determine which nodes already have a healthy agent
      ansible.builtin.set_fact:
        already_enrolled_names: "{{ fleet_status.json
          | selectattr('agentPresent', 'equalto', true)
          | selectattr('health', 'equalto', 'healthy')
          | map(attribute='name') | list }}"

    # Idempotency policy for agent (re-)enrollment:
    #
    # POST /admin/nodes/{name}/agent is NOT safe to call on an already-healthy
    # node. It unconditionally mints a fresh token, overwrites the persisted
    # node_agent record, and pushes the new token to the live router
    # (internal/admin/admin.go handleEnableNodeAgent) - a repeat call rotates
    # credentials out from under a running agent and would knock a healthy
    # connection offline for no reason. So: only call it for a node that is
    # NOT already reporting agentPresent=true AND health="healthy" via
    # GET /admin/nodes. Re-running this playbook against a fully healthy
    # fleet therefore skips agent enrollment entirely for every node.
    - name: Enable Marbor Agent and capture install command (only where needed)
      ansible.builtin.uri:
        url: "{{ marbor_url }}/admin/nodes/{{ node.name }}/agent"
        method: POST
        headers:
          Cookie: "{{ marbor_login.set_cookie }}"
        body_format: json
        body:
          port: "{{ node.port }}"
        status_code: 200
        return_content: true
      loop: "{{ agent_nodes }}"
      loop_control:
        loop_var: node
        label: "{{ node.name }} ({{ node.host }})"
      when: node.name not in already_enrolled_names
      register: agent_enable_results

    - name: Install the Marbor Agent on each newly-enrolled GPU host
      ansible.builtin.shell: "{{ (item.content | from_json).install_command }}"
      loop: "{{ agent_enable_results.results | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.node.name }} ({{ item.node.host }})"
      delegate_to: "{{ item.node.host }}"
      when: not item.skipped | default(false)
      register: install_results

    - name: Wait for each node to report agent present and healthy
      ansible.builtin.uri:
        url: "{{ marbor_url }}/admin/nodes/{{ node.name }}"
        method: GET
        headers:
          Cookie: "{{ marbor_login.set_cookie }}"
        status_code: 200
        return_content: true
      register: node_poll
      until: >-
        (node_poll.json.health | default('down')) == 'healthy' and
        (node_poll.json.agentPresent | default(false)) | bool
      retries: "{{ poll_retries }}"
      delay: "{{ poll_delay }}"
      loop: "{{ agent_nodes }}"
      loop_control:
        loop_var: node
        label: "{{ node.name }} ({{ node.host }})"
      # Do not abort the whole run because one node never came up - collect
      # per-node pass/fail so the summary below can name exactly which host
      # failed, then fail the play at the very end.
      ignore_errors: true
      register: poll_results

    - name: Build per-node final status
      ansible.builtin.set_fact:
        node_results: "{{ node_results | default([]) + [ {
          'name': presult.node.name,
          'host': presult.node.host,
          'port': presult.node.port,
          'agent_enrolled_this_run': presult.node.name not in already_enrolled_names,
          'status': ('failed' if presult.failed | default(false) else 'healthy')
          } ] }}"
      loop: "{{ poll_results.results }}"
      loop_control:
        loop_var: presult
        label: "{{ presult.node.name }}"

    - name: Agent enrollment summary
      ansible.builtin.debug:
        msg: >-
          {{ item.status | upper }} - {{ item.name }} ({{ item.host }}:{{ item.port }}),
          agent (re-)enrolled this run: {{ item.agent_enrolled_this_run }}
      loop: "{{ node_results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail the play if any node's agent did not come up healthy
      ansible.builtin.fail:
        msg: >-
          Agent enrollment incomplete. Nodes that did not report agent
          present + healthy within {{ poll_retries }} attempts
          ({{ (poll_retries | int) * (poll_delay | int) }}s):
          {{ node_results | selectattr('status', 'equalto', 'failed') | map(attribute='name') | list }}
      when: node_results | selectattr('status', 'equalto', 'failed') | list | length > 0
