# Example node list for ansible/playbooks/install-marbor-agent.yml.
#
# Copy this file (e.g. to my-agent-inventory.yml, gitignored or kept private)
# and edit the agent_nodes list to match your fleet. Same "plain vars file,
# not a classic Ansible inventory" shape as ansible/inventory.example.yml -
# the playbook loops over this list and reaches each host by IP/hostname via
# `delegate_to`, so no pre-existing inventory entry is required for the GPU
# hosts themselves.
#
# Different from inventory.example.yml (register-gpus.yml) in one important
# way: `name` and `host` here are REQUIRED, nothing is generated or defaulted.
# register-gpus.yml can invent a node name and default a port because it's
# creating a new node; this playbook is targeting an EXISTING node by exact
# name, so a generated/guessed name would silently target the wrong node (or
# fail the "already registered" check with a confusing error). There's also
# no `runtime` field - agent enrollment doesn't need to know the node's
# runtime, only its name and host.
#
# Field reference:
#   name        required - must exactly match a node already registered with
#               the marbor (via register-gpus.yml or the dashboard's "Add
#               Node"). The playbook fails fast, naming the host, if a name
#               isn't found among the marbor's current nodes.
#   host        required - IP or hostname of the GPU node. Used as the SSH
#               target for installing the marbor agent.
#   agent_port  optional - the port the marbor AGENT itself listens on (its
#               own port, NOT the runtime endpoint's). Defaults to 9200, the
#               agent binary's default; override per entry or globally with
#               -e agent_port=....

agent_nodes:
  - name: inference-gpu-a
    host: 10.10.10.21

  - name: gpu-node-02
    host: 10.10.10.22

  # Custom agent port example - only if you run the agent on a non-default
  # port on that host:
  - name: gpu-node-03
    host: 10.10.10.23
    agent_port: 9210
