<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Page Not Found | Marbor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/marbor/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#d4a853" />
<script>
  // SPA redirect for GitHub Pages demo subpath.
  // Deep-link to /demo/* → redirect directly to SPA hash route.
  // E.g. /marbor/demo/gpu-nodes → /marbor/demo/#/gpu-nodes
  (function () {
    var l = window.location;
    var path = l.pathname;
    if (path === '/marbor/demo') {
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/marbor/demo/');
    } else if (path.indexOf('/marbor/demo/') === 0) {
      var subpath = path.slice(18); // strip '/marbor/demo/' (18 chars)
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/marbor/demo/#/' + subpath + l.search + l.hash);
    }
  })();
  (function(){try{var s=localStorage.getItem("om-theme");if(s==="light"||(!s&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.classList.add("light");}catch(e){}})();
</script>
<style>
@view-transition{navigation:auto}
:root{
--bg:#0f0e0c;--bg-elevated:#1a1815;--bg-surface:#24221e;--bg-input:#2e2b26;
--border:#3a3630;--border-subtle:#2a2723;
--text:#e8e4df;--text-muted:#98917f;--text-faint:#a79f8f;
--accent:#d4a853;--accent-dim:#b8933f;--accent-bg:rgba(212,168,83,.08);--accent-bg-hover:rgba(212,168,83,.14);
--accent2:#7cb97c;--accent3:#c97c7c;--amber:#cf9440;
--font-display:"Playfair Display",Georgia,"Times New Roman",serif;
--font-sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
--font-mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
--r-lg:14px;--r-md:10px;--r-sm:7px;
--ease:cubic-bezier(.16,1,.3,1);
--shadow:0 24px 60px -24px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
}
html.light{--bg:#f5f2e9;--bg-elevated:#faf7ee;--bg-surface:#e9e4d4;--bg-input:#e3ddcb;--border:#d9d2bd;--border-subtle:#e3ddcb;--text:#2b2924;--text-muted:#4a4740;--text-faint:#6e6960;--accent:#4c3a19;--accent-dim:#3a2f16;--accent-bg:rgba(76,58,25,.08);--accent-bg-hover:rgba(76,58,25,.14);--accent2:#1d4d1d;--accent3:#702626;--amber:#8a5f16;--shadow:0 24px 50px -28px rgba(60,50,20,.35),0 2px 8px rgba(60,50,20,.12)}
html.light ::selection{background:#4c3a19;color:#f7f2e4}
html.light .btn-gold{background:#2e2413;border-color:#2e2413;color:#f5f2e9;box-shadow:0 12px 26px -14px rgba(46,36,19,.6)}
html.light .btn-gold:hover{background:#211a0e;border-color:#211a0e;color:#f5f2e9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@supports (overflow:clip){html,body{overflow-x:clip}}
@supports not (overflow:clip){body{overflow-x:hidden}}
@media print{:root{color-scheme:light}body{background:#fff!important;color:#000!important}body::before{display:none!important}}
a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 480px at 50% -8%,rgba(212,168,83,.10),transparent 65%),radial-gradient(700px 500px at 88% 22%,rgba(212,168,83,.05),transparent 60%)}
html.light body::before{background:radial-gradient(900px 480px at 50% -8%,rgba(76,58,25,.08),transparent 65%)}
::selection{background:var(--accent);color:#111}
.card{position:relative;z-index:1;max-width:560px;width:100%;border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,var(--bg-elevated),var(--bg));box-shadow:var(--shadow);padding:48px 40px;overflow:hidden}
.brand-chip{width:72px;height:72px;border-radius:18px;background:#1a1714;display:inline-grid;place-items:center;border:1px solid var(--border-subtle);margin-bottom:20px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-sans);font-size:12.5px;font-weight:600;color:var(--text-muted);border:1px solid var(--border);background:var(--bg-elevated);border-radius:99px;padding:6px 14px;margin-bottom:20px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--accent3);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent3) 18%,transparent)}
h1{font-family:var(--font-display);font-size:clamp(36px,6vw,52px);line-height:1.06;letter-spacing:-.01em;font-weight:600;margin:0 0 14px;text-wrap:balance}
h1 em{font-style:italic;color:var(--accent);font-weight:600}
.lede{font-size:16px;color:var(--text-muted);margin:0 0 26px;text-wrap:pretty}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;font-weight:650;font-size:13.5px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text);cursor:pointer;text-decoration:none;transition:transform .18s var(--ease),background .18s,border-color .18s}
.btn:hover{text-decoration:none;transform:translateY(-1px);border-color:var(--accent)}
.btn-gold{background:var(--accent);border-color:var(--accent);color:#161307}
.btn-gold:hover{background:var(--accent-dim);border-color:var(--accent-dim)}
@media(max-width:480px){.card{padding:36px 24px}h1{font-size:clamp(32px,9vw,40px)}.cta-row .btn{width:100%;justify-content:center;min-height:48px;font-size:14px}}
@media(max-width:400px){body{padding:16px}.card{padding:32px 20px}.brand-chip{width:60px;height:60px}}
</style>
</head>
<body>
<div class="card">
  <span class="brand-chip" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 100 100" fill="none"><path d="M30 35 L30 65 M30 50 L50 35 L50 65 M50 50 L70 35 L70 65" stroke="#d4a853" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75" cy="75" r="8" fill="#a87f3a"/></svg></span><br>
  <span class="eyebrow"><span class="dot" aria-hidden="true"></span>error · 404</span>
  <h1>Page <em>not found.</em></h1>
  <p class="lede">The page you're looking for doesn't exist. It may have moved or been removed.</p>
  <div class="cta-row"><a class="btn btn-gold" href="/marbor/">← Back to Marbor</a><a class="btn" href="/marbor/docs/">Read the docs</a></div>
</div>
</body>
</html>
